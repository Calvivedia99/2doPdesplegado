<section>
  <div class="d-flex justify-content-end align-items-center mb-3">
    <a class="oi-btn oi-btn-primary oi-btn-sm" routerLink="/admin/usuarios/nuevo">Nuevo usuario</a>
  </div>

  @if (exito()) {
    <div class="alert alert-success py-2" role="alert">{{ exito() }}</div>
  }
  @if (error()) {
    <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
  }

  <app-table
    [columns]="columnas"
    [data]="$any(usuarios())"
    [loading]="loading()"
    searchPlaceholder="Buscar usuario…"
    [pageSize]="25"
    emptyTitle="Sin usuarios registrados"
    emptyDescription="Crea el primer usuario para empezar a operar."
  >
    <ng-template appColumn="nombre" let-row>
      <span class="fw-medium">{{ row.nombre }} {{ row.apellido }}</span>
    </ng-template>

    <ng-template appColumn="email" let-row>
      <span class="oi-mono">{{ row.email }}</span>
    </ng-template>

    <ng-template appColumn="rolId" let-row>
      {{ getNombreRol(row.rolId) }}
    </ng-template>

    <ng-template appColumn="tipo" let-row>
      <app-status-badge variant="neutral">{{ row.tipo }}</app-status-badge>
    </ng-template>

    <ng-template appColumn="activo" let-row>
      <app-status-badge [variant]="row.activo ? 'success' : 'neutral'" [dot]="true">
        {{ row.activo ? 'Activo' : 'Inactivo' }}
      </app-status-badge>
    </ng-template>

    <ng-template appColumn="acciones" let-row>
      <div class="oi-row-actions">
        <a [routerLink]="['/admin/usuarios', row.id, 'editar']" class="oi-btn oi-btn-secondary oi-btn-sm">Editar</a>
        <button type="button" (click)="toggleActivo(row)" class="oi-btn oi-btn-ghost oi-btn-sm">
          {{ row.activo ? 'Desactivar' : 'Activar' }}
        </button>
        <button type="button" (click)="eliminar(row.id)" class="oi-btn oi-btn-danger-outline oi-btn-sm">Eliminar</button>
      </div>
    </ng-template>
  </app-table>
</section>
