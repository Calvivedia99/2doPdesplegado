<section>
  @if (exito()) {
    <div class="alert alert-success" role="alert">{{ exito() }}</div>
  }

  @if (error()) {
    <div class="alert alert-danger" role="alert">{{ error() }}</div>
  }

  <div class="row g-4">
    <div class="col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-header">{{ modoEdicion() ? 'Editar' : 'Nuevo' }} Departamento</div>
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="mb-3">
              <label class="form-label" for="codigo">Codigo *</label>
              <input
                id="codigo"
                class="form-control text-uppercase"
                formControlName="codigo"
                maxlength="5"
                placeholder="ATC, TEC, LEG, OPE"
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="nombre">Nombre *</label>
              <input id="nombre" class="form-control" formControlName="nombre" />
            </div>

            <div class="mb-3">
              <label class="form-label" for="descripcion">Descripcion *</label>
              <textarea id="descripcion" class="form-control" rows="3" formControlName="descripcion"></textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-sm" [disabled]="loading() || form.invalid">
                @if (loading()) {
                  <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                }
                {{ modoEdicion() ? 'Actualizar' : 'Crear' }}
              </button>

              @if (modoEdicion()) {
                <button type="button" class="btn btn-secondary btn-sm" (click)="cancelar()">Cancelar</button>
              }
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <app-table
        [columns]="columnas"
        [data]="$any(departamentos())"
        searchPlaceholder="Buscar departamento…"
        [pageSize]="25"
        emptyTitle="Sin departamentos registrados"
        emptyDescription="Crea el primer departamento con el formulario."
      >
        <ng-template appColumn="codigo" let-row>
          <span class="oi-badge oi-badge-neutral oi-mono">{{ row.codigo }}</span>
        </ng-template>
        <ng-template appColumn="descripcion" let-row>
          <span class="text-muted">{{ row.descripcion }}</span>
        </ng-template>
        <ng-template appColumn="activo" let-row>
          <app-status-badge [variant]="row.activo ? 'success' : 'neutral'" [dot]="true">
            {{ row.activo ? 'Activo' : 'Inactivo' }}
          </app-status-badge>
        </ng-template>
        <ng-template appColumn="acciones" let-row>
          <div class="oi-row-actions">
            <button type="button" class="oi-btn oi-btn-secondary oi-btn-sm" (click)="editar(row)">Editar</button>
            <button type="button" class="oi-btn oi-btn-danger-outline oi-btn-sm" (click)="eliminar(row.id)">Eliminar</button>
          </div>
        </ng-template>
      </app-table>
    </div>
  </div>
</section>
