<section>
  @if (exito()) {
    <div class="alert alert-success" role="alert">{{ exito() }}</div>
  }

  @if (error()) {
    <div class="alert alert-danger" role="alert">{{ error() }}</div>
  }

  <div class="row g-4">
    <div class="col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-header">{{ modoEdicion() ? 'Editar' : 'Nuevo' }} Documento</div>
        <div class="card-body">
          <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
            <div class="mb-2">
              <label class="form-label small" for="nombre">Nombre *</label>
              <input id="nombre" class="form-control form-control-sm" formControlName="nombre" />
            </div>

            <div class="mb-2">
              <label class="form-label small" for="descripcion">Descripción *</label>
              <textarea id="descripcion" class="form-control form-control-sm" rows="3" formControlName="descripcion"></textarea>
            </div>

            <div class="mb-3 form-check">
              <input id="activo" type="checkbox" class="form-check-input" formControlName="activo" />
              <label class="form-check-label small" for="activo">Activo</label>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-sm" [disabled]="loading() || form.invalid">
                {{ modoEdicion() ? 'Actualizar' : 'Crear' }}
              </button>
              @if (modoEdicion()) {
                <button type="button" class="btn btn-secondary btn-sm" (click)="cancelar()">Cancelar</button>
              }
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-8">
      <app-table
        [columns]="columnas"
        [data]="$any(documentos())"
        searchPlaceholder="Buscar documento…"
        [pageSize]="25"
        emptyTitle="Sin documentos registrados"
        emptyDescription="Crea el primer documento requerido con el formulario."
      >
        <ng-template appColumn="nombre" let-row>
          <span class="fw-medium">{{ row.nombre }}</span>
        </ng-template>
        <ng-template appColumn="descripcion" let-row>
          <span class="text-muted">{{ row.descripcion }}</span>
        </ng-template>
        <ng-template appColumn="activo" let-row>
          <app-status-badge [variant]="row.activo ? 'success' : 'neutral'" [dot]="true">
            {{ row.activo ? 'Activo' : 'Inactivo' }}
          </app-status-badge>
        </ng-template>
        <ng-template appColumn="acciones" let-row>
          <div class="oi-row-actions">
            <button type="button" class="oi-btn oi-btn-secondary oi-btn-sm" (click)="editar(row)">Editar</button>
            <button type="button" class="oi-btn oi-btn-danger-outline oi-btn-sm" (click)="eliminar(row.id)">Eliminar</button>
          </div>
        </ng-template>
      </app-table>
    </div>
  </div>
</section>
